name: demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the board reads git dates instead of falling back to mtime.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bake this repo's own tickets
        run: |
          set -euo pipefail
          mkdir -p site
          node bin/cli.mjs --out site/index.html --no-open

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: bake
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
